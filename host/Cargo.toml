[package]
name = "super-host"
version = "0.1.0"
edition = "2021"
description = "The [&] Super host: owns the human control channel, spawns engines on channels it created."

[lib]
name = "super_host"
path = "src/lib.rs"

[[bin]]
name = "super-host"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
