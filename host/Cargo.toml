[package]
name = "super-host"
version = "0.1.0"
edition = "2021"
description = "The [&] Super host: owns the human control channel, spawns engines on channels it created."

[lib]
name = "super_host"
path = "src/lib.rs"

[[bin]]
name = "super-host"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# T27 (R122): the C declarations and the per-target kernel numbers. Nothing
# else: every call, flag and struct field is still written in this crate.
libc = "0.2"

[features]
# T28 (C6): test only. The bridge on Linux speaks the framed stream macOS needs, and births and arrivals behave as on
# macOS (no SOCK_CLOEXEC, no MSG_CMSG_CLOEXEC, fcntl after), so Linux runs can catch the macOS path's bugs. Off by
# default; L8 holds the default build to SEQPACKET.
framed-bridge = []

[profile.release]
opt-level = "z"
lto = true
