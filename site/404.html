<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Super (CD)</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#05070C; --fg:#EDF1F9; --dim:#5E6C86; --sec:#93A1BB;
          --acc:#FF5C3C; --line:rgba(148,170,210,.14); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg);
         font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
         min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:2rem; line-height:1.7; }
  main { max-width:56ch; }
  .code { font-size:4.5rem; font-weight:700; letter-spacing:-0.03em; color:var(--acc); line-height:1; }
  h1 { font-size:1.05rem; font-weight:400; margin:1rem 0 1.25rem; }
  p { font-size:0.85rem; color:var(--sec); margin-bottom:1.5rem; }
  nav { font-size:0.8rem; border-top:1px solid var(--line); padding-top:1.25rem; }
  a { color:var(--acc); text-decoration:none; border-bottom:1px solid transparent; }
  a:hover { border-bottom-color:var(--acc); }
  .sep { color:var(--dim); padding:0 0.6rem; }
</style>
<script type="module" src="/amp-nav.js"></script>
</head>
<body>
<amp-nav property="super"></amp-nav>
<main>
  <div class="code">404</div>
  <h1>No such path on super.computedriven.com.</h1>
  <p>The page you asked for is not here — and nothing was served in its place.
     A runtime that answers everything with something is a runtime you cannot
     ask a question. An address that does not exist should say so.</p>
  <nav>
    <a href="/">← Super</a><span class="sep">·</span><a href="https://computedriven.com">ComputeDriven</a>
  </nav>
</main>
</body>
